name: CI — Build + Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Astro type check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Smoke test (main only)
        if: github.event_name == 'push'
        run: |
          sleep 60
          curl -sf https://nouri-scan.vercel.app/ingredient/red-40 -o /dev/null
